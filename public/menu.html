<script>
  initHeader("route.menu");

  const menuItems = [
    { labels: { ko: "김치찌개", en: "Kimchi stew", ja: "キムチチゲ" }, image: "image/Kimchi_stew.png" },
    { labels: { ko: "된장찌개", en: "Soybean paste stew", ja: "テンジャンチゲ" }, image: "image/Doenjang_stew.png" },
    { labels: { ko: "순두부찌개", en: "Soft tofu stew", ja: "スンドゥブチゲ" }, image: "image/Sundubu_stew.png" },
    { labels: { ko: "불고기", en: "Bulgogi", ja: "プルコギ" }, image: "image/Bulgogi.png" },
    { labels: { ko: "제육볶음", en: "Spicy pork", ja: "ジェユク炒め" }, image: "image/Stir_fried_pork.png" },
    { labels: { ko: "비빔밥", en: "Bibimbap", ja: "ビビンバ" }, image: "image/Bibimbap.png" },
    { labels: { ko: "삼겹살", en: "Samgyeopsal", ja: "サムギョプサル" }, image: "image/Samgyeopsal.png" },
    { labels: { ko: "돈까스", en: "Tonkatsu", ja: "トンカツ" }, image: "image/Pork_cutlet.png" },
    { labels: { ko: "치킨", en: "Fried chicken", ja: "フライドチキン" }, image: "image/Chicken.png" },
    { labels: { ko: "피자", en: "Pizza", ja: "ピザ" }, image: "image/Pizza.png" },
    { labels: { ko: "햄버거", en: "Burger", ja: "ハンバーガー" }, image: "image/Hamburger.png" },
    { labels: { ko: "라면", en: "Ramen", ja: "ラーメン" }, image: "image/Ramen.png" },
    { labels: { ko: "짬뽕", en: "Jjamppong", ja: "チャンポン" }, image: "image/Jjamppong.png" },
    { labels: { ko: "짜장면", en: "Jjajangmyeon", ja: "ジャージャー麺" }, image: "image/Jjajangmyeon.png" },
    { labels: { ko: "마라탕", en: "Malatang", ja: "マーラータン" }, image: "image/Mala_tang.png" },
    { labels: { ko: "초밥", en: "Sushi", ja: "寿司" }, image: "image/Sushi.png" },
    { labels: { ko: "파스타", en: "Pasta", ja: "パスタ" }, image: "image/Pasta.png" },
    { labels: { ko: "샐러드", en: "Salad", ja: "サラダ" }, image: "image/Salad.png" },
    { labels: { ko: "떡볶이", en: "Tteokbokki", ja: "トッポッキ" }, image: "image/Tteokbokki.png" },
    { labels: { ko: "국밥", en: "Gukbap", ja: "クッパ" }, image: "image/Gukbap.png" },
    { labels: { ko: "설렁탕", en: "Seolleongtang", ja: "ソルロンタン" }, image: "image/Seolleongtang.png" },
    { labels: { ko: "칼국수", en: "Kalguksu", ja: "カルグクス" }, image: "image/Kalguksu.png" },
    { labels: { ko: "쌀국수", en: "Pho", ja: "フォー" }, image: "image/Phosphorus_noodles.png" }
  ];
  let currentMenuIndex = null;

  const resultEl = document.getElementById("menuResult");
  const imageEl = document.getElementById("menuImage");
  const btn = document.getElementById("pickMenu");

  const menuImageCache = new Map();

  function preloadMenuImages(){
    menuItems.forEach(item => {
      if(menuImageCache.has(item.image)) return;
      const img = new Image();
      img.src = item.image;
      menuImageCache.set(item.image, img);
    });
  }

  function schedulePreload(){
    setTimeout(preloadMenuImages, 0);
  }

  // shared.js에서 제공하는 전역 함수/변수 사용:
  // - getAudioCtx(), ensureAudio(), vol()
  // - SFX_ENABLED / SFX_VOL은 shared.js에서 관리됨
  // (중복 선언하면 스크립트가 멈출 수 있음)

  function sfxShuffleStart(){
    const ctx = getAudioCtx(); if(!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(()=>{});
    const t = ctx.currentTime;

    const master = ctx.createGain();
    master.gain.setValueAtTime(vol(0.20), t);
    master.connect(ctx.destination);

    const noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.22), ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);

    const noise = ctx.createBufferSource(); noise.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.setValueAtTime(650, t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol(0.16), t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.20);

    noise.connect(hp); hp.connect(g); g.connect(master);
    noise.start(t); noise.stop(t+0.23);
    master.gain.linearRampToValueAtTime(0.0001, t+0.26);
  }

  function sfxShuffleTick(){
    const ctx = getAudioCtx(); if(!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(()=>{});
    const t = ctx.currentTime;

    const master = ctx.createGain();
    master.gain.setValueAtTime(vol(0.10), t);
    master.connect(ctx.destination);

    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(420 + Math.random()*260, t);

    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol(0.12), t+0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.035);

    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+0.045);
    master.gain.linearRampToValueAtTime(0.0001, t+0.06);
  }

  function sfxFinalDing(){
    const ctx = getAudioCtx(); if(!ctx) return;
    if (ctx.state === "suspended") ctx.resume().catch(()=>{});
    const t = ctx.currentTime;

    const master = ctx.createGain();
    master.gain.setValueAtTime(vol(0.20), t);
    master.connect(ctx.destination);

    function ding(freq, start, dur){
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type="sine";
      o.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(vol(0.18), start+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, start+dur);
      o.connect(g); g.connect(master);
      o.start(start); o.stop(start+dur+0.02);
    }
    ding(1046.5, t, 0.20);
    ding(1318.5, t+0.08, 0.20);
    master.gain.linearRampToValueAtTime(0.0001, t+0.45);
  }

  let busy = false;

  function getMenuItems(){
    return menuItems;
  }

  function getMenuLabel(item){
    const lang = document.documentElement.getAttribute("data-lang") || "ko";
    return item.labels[lang] || item.labels.ko;
  }

  function setMenuResult(item){
    resultEl.textContent = getMenuLabel(item);
    if(imageEl){
      imageEl.src = item.image;
      imageEl.alt = getMenuLabel(item);
      imageEl.classList.remove("is-hidden");
    }
  }

  function hideMenuImage(){
    if(!imageEl) return;
    imageEl.removeAttribute("src");
    imageEl.alt = "";
    imageEl.classList.add("is-hidden");
  }

  async function runShuffle(){
    if(busy) return;
    busy = true;
    btn.disabled = true;

    await ensureAudio();

    resultEl.textContent = t("menu.result.choosing");
    hideMenuImage();
    try{ sfxShuffleStart(); }catch{}

    const startAt = performance.now();
    let lastTick = 0;

    await new Promise(resolve => {
      const timer = setInterval(() => {
        const now = performance.now();

        if(now - startAt >= 2000){
          clearInterval(timer);
          resolve();
          return;
        }

        if(now - lastTick >= 70){
          lastTick = now;
          const items = getMenuItems();
          const item = items[Math.floor(Math.random() * items.length)];
          resultEl.textContent = getMenuLabel(item);
          try{ sfxShuffleTick(); }catch{}
        }
      }, 16);
    });

    const items = getMenuItems();
    currentMenuIndex = Math.floor(Math.random() * items.length);
    setMenuResult(items[currentMenuIndex]);
    try{ sfxFinalDing(); }catch{}

    btn.disabled = false;
    busy = false;
  }

  btn.addEventListener("click", runShuffle);
  schedulePreload();

  window.addEventListener("langchange", () => {
    if(currentMenuIndex === null) return;
    const items = getMenuItems();
    if(currentMenuIndex < items.length){
      setMenuResult(items[currentMenuIndex]);
    }
  });
</script>
