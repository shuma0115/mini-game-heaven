<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오목 게임</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0e6d2;
            color: #3a2a1a;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #3a2a1a;
        }
        #game-board {
            border: 2px solid #3a2a1a;
            background-color: #d2b48c;
            cursor: pointer;
        }
        .controls {
            margin-top: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #3a2a1a;
            color: white;
            cursor: pointer;
        }
        #status {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>오목 (렌주룰)</h1>
        <canvas id="game-board" width="600" height="600"></canvas>
        <div class="controls">
            <button id="reset-button">새 게임</button>
        </div>
        <div id="status">흑돌 차례</div>
    </div>
    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const resetButton = document.getElementById('reset-button');

        const BOARD_SIZE = 15;
        const CELL_SIZE = 40;
        const PADDING = 20;

        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let currentPlayer = 1; // 1 for human (black), 2 for computer (white)
        let gameOver = false;

        // Sound effects using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
             if (!audioCtx) return;
            
            if (type === 'place') {
                // Realistic stone sound
                const stoneClick = audioCtx.createBufferSource();
                const noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.05, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                stoneClick.buffer = noiseBuffer;

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);

                stoneClick.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                stoneClick.start();
                
                const thud = audioCtx.createOscillator();
                thud.type = 'sine';
                thud.frequency.setValueAtTime(150, audioCtx.currentTime);
                const thudGain = audioCtx.createGain();
                thudGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                thudGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
                thud.connect(thudGain);
                thudGain.connect(audioCtx.destination);
                thud.start();
                thud.stop(audioCtx.currentTime + 0.1);

            } else if (type === 'win') {
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1);
            } else if (type === 'lose') {
                const oscillator = audioCtx.createOscillator();
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(220, audioCtx.currentTime);
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 1);
            }
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#d2b48c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 1;

            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE);
                ctx.stroke();
            }
            
            for(let y = 0; y < BOARD_SIZE; y++) {
                for(let x = 0; x < BOARD_SIZE; x++) {
                    if(board[y][x] !== 0) {
                        drawStone(x, y, board[y][x]);
                    }
                }
            }
        }
        
        function drawStone(x, y, player) {
            ctx.beginPath();
            ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, CELL_SIZE / 2 - 2, 0, 2 * Math.PI);
            ctx.fillStyle = player === 1 ? 'black' : 'white';
            ctx.fill();
        }

        function checkPlayerWin(x, y) {
            const player = 1; // Always check for black player
            if(board[y][x] !== player) return false;

            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (const [dx, dy] of dirs) {
                let count = 1;
                for (let i = 1; i < 6; i++) {
                    if (board[y + i * dy]?.[x + i * dx] === player) count++; else break;
                }
                for (let i = 1; i < 6; i++) {
                    if (board[y - i * dy]?.[x - i * dx] === player) count++; else break;
                }

                if (count === 5) return true; // Win
                if (count > 5) return 'overline'; // Loss condition for black
            }
            return false;
        }
        
        function isForbidden(x, y, player) {
            if (player !== 1) return false;

            board[y][x] = player;
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            let three_count = 0;
            let four_count = 0;

            for (const [dx, dy] of dirs) {
                if (isOpenThree(x, y, player, dx, dy)) three_count++;
                if (isFour(x, y, player, dx, dy)) four_count++;
            }
            
            board[y][x] = 0;
            return three_count >= 2 || four_count >= 2;
        }

        function isOpenThree(x, y, player, dx, dy) {
            let count = 0;
            const line = [];
            for (let i = -4; i <= 4; i++) {
                const nx = x + i * dx;
                const ny = y + i * dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    line.push(board[ny][nx]);
                } else {
                    line.push(3); // Wall
                }
            }
            
            // Pattern for open three: 0, 1, 1, 1, 0 (with the new stone being one of the 1s)
            // This is a simplified check. A full check is much more complex.
            const pattern = JSON.stringify(line);
            if (pattern.includes('[0,1,1,1,0]')) return true;

            return false;
        }
        
        function isFour(x, y, player, dx, dy) {
            let count = 0;
            const line = [];
            for (let i = -4; i <= 4; i++) {
                const nx = x + i * dx;
                const ny = y + i * dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
                    line.push(board[ny][nx]);
                } else {
                    line.push(3); // Wall
                }
            }
            const pattern = JSON.stringify(line);
            if(pattern.includes('[0,1,1,1,1,0]') || pattern.includes('[0,1,1,1,1,2]') || pattern.includes('[2,1,1,1,1,0]')) return true;
            return false;
        }

        function handleCanvasClick(event) {
            if (gameOver || currentPlayer !== 1) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.round((event.clientX - rect.left - PADDING) / CELL_SIZE);
            const y = Math.round((event.clientY - rect.top - PADDING) / CELL_SIZE);

            if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE || board[y][x] !== 0) return;

            if (isForbidden(x, y, 1)) {
                statusEl.textContent = '금수입니다! 당신의 패배입니다.';
                playSound('lose');
                gameOver = true;
                return;
            }

            board[y][x] = 1;
            drawBoard();
            playSound('place');

            const winCheck = checkPlayerWin(x, y);
            if (winCheck === true) {
                gameOver = true;
                statusEl.textContent = '당신이 이겼습니다!';
                playSound('win');
                return;
            } else if (winCheck === 'overline') {
                gameOver = true;
                statusEl.textContent = '육목 이상으로 당신의 패배입니다!';
                playSound('lose');
                return;
            }
            
            currentPlayer = 2;
            statusEl.textContent = '컴퓨터 차례...';
            setTimeout(computerTurn, 500);
        }
        
        function computerTurn() {
            if (gameOver) return;

            const move = findBestMove();
            board[move.y][move.x] = 2;
            drawBoard();
            playSound('place');

            if (checkComputerWin(move.x, move.y)) {
                gameOver = true;
                statusEl.textContent = '컴퓨터가 이겼습니다.';
                playSound('lose');
                return;
            }

            currentPlayer = 1;
            statusEl.textContent = '당신 차례';
        }
        
        function checkComputerWin(x,y) {
            const player = 2;
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (const [dx, dy] of dirs) {
                let count = 1;
                for (let i = 1; i < 6; i++) {
                    if (board[y + i * dy]?.[x + i * dx] === player) count++; else break;
                }
                for (let i = 1; i < 6; i++) {
                    if (board[y - i * dy]?.[x - i * dx] === player) count++; else break;
                }
                if (count >= 5) return true;
            }
            return false;
        }

        function findBestMove() {
             let bestScore = -Infinity;
            let move = {x: -1, y: -1};

            for (let y = 0; y < BOARD_SIZE; y++) {
                for (let x = 0; x < BOARD_SIZE; x++) {
                    if (board[y][x] === 0) {
                        let score = 0;
                        // Simple heuristic: prefer moves closer to existing stones
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                if (dx === 0 && dy === 0) continue;
                                const nx = x + dx;
                                const ny = y + dy;
                                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] !== 0) {
                                    score += 1;
                                }
                            }
                        }

                        // Check if this move wins for computer
                        board[y][x] = 2;
                        if (checkComputerWin(x, y)) {
                            score += 1000;
                        }
                        board[y][x] = 0;

                        // Check if this move blocks player from winning
                        board[y][x] = 1;
                        if (checkPlayerWin(x,y) === true) {
                            score += 500;
                        }
                        board[y][x] = 0;

                        if (score > bestScore) {
                            bestScore = score;
                            move = {x, y};
                        }
                    }
                }
            }
            if(move.x === -1){ // if no good move found, pick a random empty spot
                let emptySpots = [];
                for (let y = 0; y < BOARD_SIZE; y++) {
                    for (let x = 0; x < BOARD_SIZE; x++) {
                        if(board[y][x] === 0) emptySpots.push({x,y});
                    }
                }
                move = emptySpots[Math.floor(Math.random() * emptySpots.length)];
            }
            return move;
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            gameOver = false;
            statusEl.textContent = '당신 차례';
            drawBoard();
        }

        canvas.addEventListener('click', handleCanvasClick);
        resetButton.addEventListener('click', resetGame);

        drawBoard();
    </script>
</body>
</html>
