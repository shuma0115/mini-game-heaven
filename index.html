<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오목 게임</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0e6d2;
            color: #3a2a1a;
        }
        .container {
            text-align: center;
            background-color: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #3a2a1a;
        }
        #game-board {
            border: 2px solid #3a2a1a;
            background-color: #d2b48c;
            cursor: pointer;
        }
        .controls {
            margin-top: 1rem;
        }
        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            background-color: #3a2a1a;
            color: white;
            cursor: pointer;
        }
        #status {
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>오목 (렌주룰)</h1>
        <canvas id="game-board" width="600" height="600"></canvas>
        <div class="controls">
            <button id="reset-button">새 게임</button>
        </div>
        <div id="status">흑돌 차례</div>
    </div>
    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const resetButton = document.getElementById('reset-button');

        const BOARD_SIZE = 15;
        const CELL_SIZE = 40;
        const PADDING = 20;

        let board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let currentPlayer = 1; // 1 for black, 2 for white
        let gameOver = false;

        // Sound effects using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

            if (type === 'place') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
            } else if (type === 'win') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1);
            } else if (type === 'lose') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(220, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 1);
            }

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1);
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#d2b48c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 1;

            for (let i = 0; i < BOARD_SIZE; i++) {
                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(PADDING + i * CELL_SIZE, PADDING);
                ctx.lineTo(PADDING + i * CELL_SIZE, PADDING + (BOARD_SIZE - 1) * CELL_SIZE);
                ctx.stroke();

                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(PADDING, PADDING + i * CELL_SIZE);
                ctx.lineTo(PADDING + (BOARD_SIZE - 1) * CELL_SIZE, PADDING + i * CELL_SIZE);
                ctx.stroke();
            }
            
            // Draw stones
            for(let y = 0; y < BOARD_SIZE; y++) {
                for(let x = 0; x < BOARD_SIZE; x++) {
                    if(board[y][x] !== 0) {
                        drawStone(x, y, board[y][x]);
                    }
                }
            }
        }
        
        function drawStone(x, y, player) {
            ctx.beginPath();
            ctx.arc(PADDING + x * CELL_SIZE, PADDING + y * CELL_SIZE, CELL_SIZE / 2 - 2, 0, 2 * Math.PI);
            ctx.fillStyle = player === 1 ? 'black' : 'white';
            ctx.fill();
            ctx.strokeStyle = player === 1 ? 'white' : 'black';
            ctx.stroke();
        }

        function checkWin(x, y) {
            const player = board[y][x];
            if(player === 0) return false;

            // Directions: horizontal, vertical, diagonal down, diagonal up
            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (const [dx, dy] of dirs) {
                let count = 1;
                // Count in the positive direction
                for (let i = 1; i < 5; i++) {
                    const nx = x + i * dx;
                    const ny = y + i * dy;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === player) {
                        count++;
                    } else {
                        break;
                    }
                }
                // Count in the negative direction
                for (let i = 1; i < 5; i++) {
                    const nx = x - i * dx;
                    const ny = y - i * dy;
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === player) {
                        count++;
                    } else {
                        break;
                    }
                }

                if (count === 5) return true;
                // For Renju rules, black loses if an overline is formed
                if (player === 1 && count > 5) {
                    statusEl.textContent = '흑돌의 육목 이상으로 백돌 승리!';
                    gameOver = true;
                    return false; // This is not a win for black, it's a loss
                }
                if(player === 2 && count >= 5) return true;
            }
            return false;
        }
        
        function isForbidden(x, y, player) {
            if (player !== 1) return false; // Rules only apply to black

            board[y][x] = player; // Temporarily place the stone to check

            const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            let three_count = 0;
            let four_count = 0;

            for (const [dx, dy] of dirs) {
                // Check for open threes
                if (isOpenThree(x, y, player, dx, dy)) {
                    three_count++;
                }
                // Check for fours
                if (isFour(x, y, player, dx, dy)) {
                    four_count++;
                }
            }
            
            board[y][x] = 0; // Remove the temporary stone

            return three_count >= 2 || four_count >= 2;
        }

        function isOpenThree(x, y, player, dx, dy) {
            let count = 1;
            let open_ends = 0;

            // Check one direction
            let i = 1;
            while (true) {
                const nx = x + i * dx;
                const ny = y + i * dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === player) {
                    count++;
                } else {
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === 0) {
                        open_ends++;
                    }
                    break;
                }
                i++;
            }

            // Check opposite direction
            i = 1;
            while (true) {
                const nx = x - i * dx;
                const ny = y - i * dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === player) {
                    count++;
                } else {
                    if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === 0) {
                        open_ends++;
                    }
                    break;
                }
                i++;
            }

            return count === 3 && open_ends === 2;
        }
        
        function isFour(x, y, player, dx, dy) {
            let count = 1;

            // Check one direction
            let i = 1;
            while (true) {
                const nx = x + i * dx;
                const ny = y + i * dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === player) {
                    count++;
                } else {
                    break;
                }
                i++;
            }

            // Check opposite direction
            i = 1;
            while (true) {
                const nx = x - i * dx;
                const ny = y - i * dy;
                if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === player) {
                    count++;
                } else {
                    break;
                }
                i++;
            }

            return count === 4;
        }

        function handleCanvasClick(event) {
            if (gameOver) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.round((event.clientX - rect.left - PADDING) / CELL_SIZE);
            const y = Math.round((event.clientY - rect.top - PADDING) / CELL_SIZE);

            if (x < 0 || x >= BOARD_SIZE || y < 0 || y >= BOARD_SIZE) return;

            if (board[y][x] === 0) {
                if(isForbidden(x, y, currentPlayer)) {
                    statusEl.textContent = '흑돌의 금수입니다!';
                    playSound('lose');
                    gameOver = true;
                    return;
                }
                
                board[y][x] = currentPlayer;
                drawBoard();
                playSound('place');

                if (checkWin(x, y)) {
                    gameOver = true;
                    statusEl.textContent = `${currentPlayer === 1 ? '흑돌' : '백돌'} 승리!`;
                    playSound('win');
                } else if (gameOver) { // Overline case for black
                    playSound('lose');
                }
                else {
                    currentPlayer = currentPlayer === 1 ? 2 : 1;
                    statusEl.textContent = `${currentPlayer === 1 ? '흑돌' : '백돌'} 차례`;
                }
            }
        }

        function resetGame() {
            board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
            currentPlayer = 1;
            gameOver = false;
            statusEl.textContent = '흑돌 차례';
            drawBoard();
        }

        canvas.addEventListener('click', handleCanvasClick);
        resetButton.addEventListener('click', resetGame);

        drawBoard();
    </script>
</body>
</html>
